spring:
  application:
    name: backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=testing1;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MY_EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  properties:
    hibernate:
      connection:
        characterEncoding: UTF-8
        useUnicode: true
        charSet: UTF-8

jwt:
  secret: ${JWT_SECRET}

file:
  upload-dir: ./uploads

server:
  port: 8080
  servlet:
    context-path: /api/v1

google:
  client-id: ${GOOGLE_CLIENT_ID}